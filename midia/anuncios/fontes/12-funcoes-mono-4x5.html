<!doctype html>
<meta charset="utf-8">
<!--
  Peça 4:5 · ângulo "12 funções" · monocromática

  Refaz a peça que mais converteu em 02/09 (R$ 4,93 por checkout iniciado,
  contra R$ 14 e R$ 18 das outras duas que converteram). A versão que está
  no ar ganhou com dois defeitos impressos: os rótulos do prompt
  ("L1 HEADLINE", "L2 EXPLAINER", "L3 BUTTON") desenhados dentro da arte,
  e a paleta âmbar, que não é da marca. O ângulo carregou; a execução
  atrapalhou. Esta versão mantém o ângulo e tira o defeito.

  Renderizar:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless=new --disable-gpu --hide-scrollbars \
      --user-data-dir="$(mktemp -d)" --no-first-run --no-default-browser-check \
      --virtual-time-budget=7000 --force-device-scale-factor=1 \
      --screenshot=saida.png --window-size=1080,1350 \
      "file://$PWD/12-funcoes-mono-4x5.html"
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Paleta da marca. Nenhuma cor fora desta lista entra na peça. */
  :root{
    --obsidian:#0B0B0B;
    --carbon:#1D1D1D;
    --graphite:#4A4A4A;
    --silver-mist:#C7C7C7;
    --soft-silver:#E8E8E8;
    --ghost:#F7F7FF;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px}
  body{
    background:var(--obsidian);
    font-family:Inter,system-ui,sans-serif;
    position:relative;
    overflow:hidden;
  }

  /* Grade quase invisível. Dá textura sem virar elemento — no feed ela é
     percebida como profundidade, não como desenho. */
  .grade{
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
    background-size:90px 90px;
  }
  /* Luz fria vinda de cima, à esquerda: separa o título do fundo sem
     precisar de caixa nem de sombra. */
  .luz{
    position:absolute; left:-260px; top:-320px;
    width:1100px; height:1100px;
    background:radial-gradient(circle, rgba(247,247,255,.055) 0%, rgba(247,247,255,0) 62%);
  }

  .peca{position:relative; height:100%; padding:150px 96px 96px}

  h1{
    font-family:Fraunces,Georgia,serif;
    font-optical-sizing:auto;
    font-weight:700;
    font-size:104px;
    line-height:.98;
    letter-spacing:-.018em;
    color:var(--ghost);
  }

  .fio{
    width:132px; height:1px;
    background:linear-gradient(90deg,var(--graphite),rgba(74,74,74,0));
    margin:52px 0 40px;
  }

  p{
    font-size:35px;
    line-height:1.42;
    color:var(--silver-mist);
    max-width:790px;
    font-weight:400;
  }

  /* O diagrama.

     Quatro pessoas em cima, doze funções embaixo, ligadas por fio de
     cabelo. É a frase desenhada — não é ilustração decorativa. Fica em
     prata e grafite; a versão âmbar usava hexágono brilhante, que rouba a
     atenção do título e não é da marca. */
  .diagrama{position:absolute; left:96px; right:96px; bottom:186px}

  /* As quatro colunas ocupam a largura inteira do bloco de texto. Na
     primeira versao elas ficavam agrupadas a esquerda e metade da peca
     sobrava vazia — no feed isso le como erro de montagem, nao como ar. */
  .pessoas,.hastes,.funcoes{display:flex; justify-content:space-between}

  .pessoa{width:130px}
  .cabeca{
    width:30px; height:30px; border-radius:50%;
    background:var(--soft-silver);
    margin:0 auto 8px;
  }
  .ombro{
    width:62px; height:30px;
    border-radius:31px 31px 0 0;
    background:var(--soft-silver);
    margin:0 auto;
  }

  .hastes{height:118px}
  .haste{width:130px; display:flex; justify-content:center}
  .haste span{width:1px; height:100%; background:var(--graphite)}

  .coluna{width:130px; display:flex; flex-direction:column; gap:28px}
  .funcao{
    height:62px;
    border:1px solid var(--graphite);
    border-radius:31px;
  }
  /* Uma de cada coluna preenchida: a peça não fica plana e o olho tem
     onde pousar depois de ler. */
  .funcao.cheia{background:var(--carbon); border-color:var(--silver-mist)}

  .marca{
    position:absolute; left:96px; bottom:88px;
    display:flex; align-items:center; gap:15px;
    font-size:20px; font-weight:600;
    letter-spacing:.30em;
    color:var(--graphite);
  }
  .escudo{
    width:26px; height:29px;
    background:var(--graphite);
    clip-path:polygon(50% 0,100% 22%,100% 62%,50% 100%,0 62%,0 22%);
  }
</style>

<div class="grade"></div>
<div class="luz"></div>

<div class="peca">
  <h1>Quatro pessoas.<br>Doze funções.</h1>
  <div class="fio"></div>
  <p>Cada Skill é um cargo. Sua equipe deixa de executar e passa a aprovar.</p>

  <div class="diagrama">
    <div class="pessoas">
      <div class="pessoa"><div class="cabeca"></div><div class="ombro"></div></div>
      <div class="pessoa"><div class="cabeca"></div><div class="ombro"></div></div>
      <div class="pessoa"><div class="cabeca"></div><div class="ombro"></div></div>
      <div class="pessoa"><div class="cabeca"></div><div class="ombro"></div></div>
    </div>
    <div class="hastes">
      <div class="haste"><span></span></div>
      <div class="haste"><span></span></div>
      <div class="haste"><span></span></div>
      <div class="haste"><span></span></div>
    </div>
    <div class="funcoes">
      <div class="coluna"><div class="funcao cheia"></div><div class="funcao"></div><div class="funcao"></div></div>
      <div class="coluna"><div class="funcao"></div><div class="funcao cheia"></div><div class="funcao"></div></div>
      <div class="coluna"><div class="funcao"></div><div class="funcao"></div><div class="funcao cheia"></div></div>
      <div class="coluna"><div class="funcao cheia"></div><div class="funcao"></div><div class="funcao"></div></div>
    </div>
  </div>

  <div class="marca"><span class="escudo"></span>BLUESHIELDPRO</div>
</div>
